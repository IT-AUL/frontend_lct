name: deckdna-app

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    image: ghcr.io/it-aul/deckdna-api:${API_TAG:?API_TAG is required}
    command:
      - uvicorn
      - deckdna.api.app:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=1
      - --proxy-headers
      - --forwarded-allow-ips=*
    restart: unless-stopped
    environment:
      DECKDNA_MOCK_PROVIDER: ${DECKDNA_MOCK_PROVIDER:-true}
      DECKDNA_PROVIDER_BASE_URL: ${DECKDNA_PROVIDER_BASE_URL:-}
      DECKDNA_PROVIDER_API_KEY: ${DECKDNA_PROVIDER_API_KEY:-}
      DECKDNA_MODEL_TEXT: ${DECKDNA_MODEL_TEXT:-}
      DECKDNA_MODEL_VISION: ${DECKDNA_MODEL_VISION:-}
      DECKDNA_MAX_UPLOAD_MB: ${DECKDNA_MAX_UPLOAD_MB:-200}
      DECKDNA_JOB_TIMEOUT_S: ${DECKDNA_JOB_TIMEOUT_S:-600}
      DECKDNA_MAX_PARALLEL_VARIANTS: ${DECKDNA_MAX_PARALLEL_VARIANTS:-3}
      DECKDNA_GEN_WORKERS: ${DECKDNA_GEN_WORKERS:-4}
      DECKDNA_OFFICIAL_MODE: ${DECKDNA_OFFICIAL_MODE:-true}
      DECKDNA_ARTIFACT_ROOT: /data/artifacts
      HOME: /tmp
    volumes:
      - api-artifacts:/data/artifacts
    tmpfs:
      - /tmp:size=512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${API_MEM_LIMIT:-3072m}
    cpus: ${API_CPUS:-3}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.deckdna.stack: deckdna
      com.deckdna.role: api
    logging: *logging
    networks:
      - deckdna

  web:
    image: ghcr.io/it-aul/deckdna-web:${WEB_TAG:?WEB_TAG is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - 127.0.0.1:${WEB_PORT:-18100}:80
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=755
      - /var/cache/nginx:size=64m
      - /var/run:size=1m
      - /tmp:size=16m
    mem_limit: 128m
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    labels:
      com.deckdna.stack: deckdna
      com.deckdna.role: web
    logging: *logging
    networks:
      - deckdna

volumes:
  api-artifacts:
    name: deckdna_api_artifacts

networks:
  deckdna:
    external: true
    name: deckdna
