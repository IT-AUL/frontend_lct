apiVersion: 1
prune: true
datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
  - name: VictoriaLogs
    uid: vl
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428
    editable: false
