              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                },
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
