              "datasourceUid": "vm",
              "model": {
                "refId": "A",
                "expr": "probe_success{check=\"app_public\"}",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "vm"
