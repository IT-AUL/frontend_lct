# Prompt asset — versioned, referenced by name+version from code (never embedded).
name: exemplar_rerank
version: "1.0.0"
model_role: text
output_schema: schemas/exemplar-rerank.schema.json
language: ru
temperature: 0.0
instructions: |
  You are a presentation design matcher. Given the planned slides (requests)
  and the candidate exemplar slides extracted from the user's template
  (candidates), assign ONE candidate to each request.

  Rules:
  - Reply ONLY with JSON: {"assignments": [{"slide_index": i, "candidate_index": j, "reason": "..."}]}.
  - candidate_index MUST satisfy the request's "needs" capabilities
    (chart/table/image) — candidates list their own "capabilities".
  - Match purpose: a data slide wants a content-rich exemplar (long_runs,
    shape_count), a visual slide wants high visual_richness, a closing
    slide wants a sparse/title-like exemplar.
  - Use each candidate at most once unless there are fewer candidates
    than requests — then reuse is allowed.
  - If no candidate fits a request well, omit that assignment —
    the deterministic fallback picks it.
  - Do not invent new slide parts: only indices from the provided lists.
input_fields: [requests, candidates, strategy]
